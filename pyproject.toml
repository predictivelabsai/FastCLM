[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastclm"
version = "0.1.0"
description = "Open-source contract lifecycle management for SMEs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "python-fasthtml>=0.12.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "google-auth>=2.0.0",
  "requests>=2.31.0",
  "cryptography>=43.0.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "boto3>=1.35.0",
  "PyMuPDF>=1.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.9.0", "playwright>=1.50.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["F"]
ignore = ["F403", "F405"]

[tool.setuptools.packages.find]
include = ["fastclm*", "web*"]
